<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Ujian Ekonomi</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #eef2ff,
      #f8fafc
    );

  color: #1e293b;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 18px;
}

.header {
  background:
    linear-gradient(
      135deg,
      #1e3a8a,
      #2563eb
    );

  color: white;

  padding: 24px;

  border-radius: 20px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.12);

  margin-bottom: 18px;
}

.header h1 {
  margin: 0 0 8px;
  font-size: 25px;
}

.header p {
  margin: 4px 0;
  opacity: .9;
}

.card {
  background: white;

  border-radius: 18px;

  padding: 20px;

  margin-bottom: 18px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.07);
}

label {
  font-weight: bold;

  display: block;

  margin-bottom: 7px;
}

input[type="text"],
select {

  width: 100%;

  padding: 14px;

  border-radius: 12px;

  border: 1px solid #cbd5e1;

  font-size: 16px;

  margin-bottom: 15px;
}

input:focus,
select:focus {

  outline: none;

  border-color: #2563eb;

  box-shadow:
    0 0 0 3px rgba(37,99,235,.12);
}

button {

  width: 100%;

  border: none;

  padding: 15px;

  border-radius: 13px;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

  background: #2563eb;

  color: white;

  transition: .2s;
}

button:hover {
  transform: translateY(-1px);
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.info-bar {

  position: sticky;

  top: 0;

  z-index: 20;

  background:
    rgba(255,255,255,.96);

  backdrop-filter:
    blur(10px);

  padding: 10px 0;

  margin-bottom: 15px;

  border-bottom:
    1px solid #e2e8f0;
}

.info-inner {

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  gap: 10px;
}

.progress {

  height: 9px;

  background: #e2e8f0;

  border-radius: 20px;

  overflow: hidden;

  margin-top: 8px;
}

.progress-bar {

  height: 100%;

  width: 0%;

  background:
    linear-gradient(
      90deg,
      #2563eb,
      #06b6d4
    );

  transition: .3s;
}

.timer {

  font-weight: bold;

  color: #1d4ed8;

  white-space: nowrap;
}

.question {

  scroll-margin-top: 100px;

  border: 1px solid #e2e8f0;

  border-radius: 17px;

  padding: 18px;

  margin-bottom: 16px;

  background: #fff;
}

.question-number {

  display: inline-block;

  background: #dbeafe;

  color: #1d4ed8;

  padding: 5px 10px;

  border-radius: 20px;

  font-size: 13px;

  font-weight: bold;

  margin-bottom: 10px;
}

.question-text {

  font-weight: bold;

  line-height: 1.55;

  margin-bottom: 14px;
}

.option {

  display: flex;

  align-items: flex-start;

  gap: 10px;

  padding: 13px;

  margin-top: 9px;

  border: 1px solid #e2e8f0;

  border-radius: 12px;

  cursor: pointer;

  transition: .2s;

  line-height: 1.45;
}

.option:hover {

  background: #f8fafc;

  border-color: #93c5fd;
}

.option.selected {

  background: #eff6ff;

  border-color: #2563eb;
}

.option input {

  margin-top: 3px;

  width: 18px;

  height: 18px;

  flex-shrink: 0;
}

.submit-area {

  position: sticky;

  bottom: 0;

  background:
    rgba(255,255,255,.96);

  backdrop-filter:
    blur(10px);

  padding: 12px 0;

  border-top:
    1px solid #e2e8f0;
}

.warning {

  background: #fef3c7;

  color: #92400e;

  padding: 13px;

  border-radius: 12px;

  margin-bottom: 15px;

  display: none;

  line-height: 1.5;
}

.error {

  background: #fee2e2;

  color: #991b1b;

  padding: 13px;

  border-radius: 12px;

  margin-bottom: 15px;

  display: none;
}

.success {

  text-align: center;

  padding: 45px 20px;
}

.success-icon {

  font-size: 60px;

  margin-bottom: 15px;
}

.success h2 {

  color: #166534;

  margin-bottom: 10px;
}

.hidden {
  display: none !important;
}

@media(max-width:600px) {

  .container {
    padding: 10px;
  }

  .header {
    padding: 20px;
    border-radius: 16px;
  }

  .header h1 {
    font-size: 21px;
  }

  .card {
    padding: 15px;
    border-radius: 15px;
  }

  .question {
    padding: 14px;
  }

  .option {
    font-size: 14px;
    padding: 12px;
  }

  .info-inner {
    font-size: 13px;
  }

}

</style>

</head>


<body>

<div class="container">


<!-- =================================================
     IDENTITAS
================================================= -->

<div id="identityPage">

  <div class="header">

    <h1>📘 Ujian Ekonomi</h1>

    <p>
      Materi: Permintaan dan Elastisitas Permintaan
    </p>

    <p>
      SMA Negeri 1 Cidahu
    </p>

  </div>


  <div class="card">

    <label for="nama">
      Nama Siswa
    </label>

    <input
      type="text"
      id="nama"
      placeholder="Tuliskan nama lengkap"
      autocomplete="off"
    >


    <label for="kelas">
      Kelas
    </label>

    <select id="kelas">

      <option value="">
        Pilih kelas
      </option>

      <option value="10.1">10.1</option>
      <option value="10.2">10.2</option>
      <option value="10.3">10.3</option>
      <option value="10.4">10.4</option>
      <option value="10.5">10.5</option>
      <option value="10.6">10.6</option>

    </select>


    <div id="startError"
         class="error">
    </div>


    <button
      id="startButton"
      onclick="mulaiUjian()">

      🚀 Mulai Ujian

    </button>

  </div>

</div>



<!-- =================================================
     HALAMAN UJIAN
================================================= -->

<div id="examPage"
     class="hidden">


  <div class="header">

    <h1>
      📚 Ujian Ekonomi
    </h1>

    <p>
      Jawablah seluruh soal dengan teliti.
    </p>

  </div>


  <div class="info-bar">

    <div class="info-inner">

      <div>

        <strong>
          Progress:
        </strong>

        <span id="progressText">
          0 / 100
        </span>

      </div>

      <div class="timer"
           id="timer">

        00:00:00

      </div>

    </div>


    <div class="progress">

      <div
        id="progressBar"
        class="progress-bar">
      </div>

    </div>

  </div>


  <div
    id="warning"
    class="warning">
  </div>


  <div id="questions">
  </div>


  <div class="submit-area">

    <button
      id="submitButton"
      onclick="kirimUjian()">

      📤 Kirim Jawaban

    </button>

  </div>

</div>



<!-- =================================================
     HALAMAN SELESAI
================================================= -->

<div id="successPage"
     class="hidden">

  <div class="card success">

    <div class="success-icon">
      ✅
    </div>

    <h2>
      Ujian Telah Selesai
    </h2>

    <p>
      Terima kasih. Jawaban Anda telah berhasil
      dikirim.
    </p>

    <p>
      Silakan mengikuti arahan guru berikutnya.
    </p>

  </div>

</div>


</div>


<script>


/* =====================================================
   VARIABEL
===================================================== */

let token = "";

let startTime = null;

let questions = [];

let answers = {};

let timerInterval = null;

let examActive = false;


/* =====================================================
   MULAI UJIAN
===================================================== */

function mulaiUjian() {

  const nama =
    document
      .getElementById("nama")
      .value
      .trim();

  const kelas =
    document
      .getElementById("kelas")
      .value;


  const error =
    document.getElementById("startError");


  error.style.display = "none";


  if (!nama) {

    tampilError(
      error,
      "Nama siswa wajib diisi."
    );

    return;
  }


  if (!kelas) {

    tampilError(
      error,
      "Silakan pilih kelas."
    );

    return;
  }


  const button =
    document.getElementById("startButton");

  button.disabled = true;

  button.textContent =
    "⏳ Menyiapkan soal...";


  google.script.run

    .withSuccessHandler(function(result) {

      if (!result || !result.ok) {

        tampilError(
          error,
          "Ujian tidak dapat dimulai."
        );

        button.disabled = false;

        button.textContent =
          "🚀 Mulai Ujian";

        return;
      }


      token =
        result.token;

      startTime =
        new Date(result.startTime);

      questions =
        result.questions;


      examActive = true;


      document
        .getElementById("identityPage")
        .classList.add("hidden");


      document
        .getElementById("examPage")
        .classList.remove("hidden");


      renderQuestions();

      mulaiTimer();


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    })

    .withFailureHandler(function(err) {

      tampilError(
        error,
        err.message ||
        "Terjadi kesalahan."
      );

      button.disabled = false;

      button.textContent =
        "🚀 Mulai Ujian";

    })

    .startExam(
      nama,
      kelas
    );

}


/* =====================================================
   TAMPIL ERROR
===================================================== */

function tampilError(element, message) {

  element.textContent =
    "⚠️ " + message;

  element.style.display =
    "block";
}


/* =====================================================
   RENDER SOAL
===================================================== */

function renderQuestions() {

  const container =
    document.getElementById("questions");

  container.innerHTML = "";


  questions.forEach(function(item, index) {

    const card =
      document.createElement("div");

    card.className =
      "question";

    card.id =
      "question-" + item.id;


    const number =
      document.createElement("div");

    number.className =
      "question-number";

    number.textContent =
      "Soal " + (index + 1);


    const text =
      document.createElement("div");

    text.className =
      "question-text";

    text.textContent =
      item.q;


    card.appendChild(number);

    card.appendChild(text);


    item.options.forEach(function(option) {

      const label =
        document.createElement("label");

      label.className =
        "option";


      const checkbox =
        document.createElement("input");

      checkbox.type =
        "checkbox";

      checkbox.name =
        item.id;

      checkbox.value =
        option.id;


      checkbox.addEventListener(
        "change",
        function() {

          if (this.checked) {

            /*
             * Walaupun checkbox digunakan
             * sebagai tampilan pilihan,
             * setiap soal hanya boleh
             * memiliki satu jawaban.
             */

            const siblings =
              card.querySelectorAll(
                'input[type="checkbox"]'
              );

            siblings.forEach(
              function(other) {

                if (other !== checkbox) {

                  other.checked =
                    false;

                }

              }
            );


            answers[item.id] =
              option.id;


            label.classList.add(
              "selected"
            );


            siblings.forEach(
              function(other) {

                if (
                  other !== checkbox
                ) {

                  other
                    .closest(".option")
                    .classList
                    .remove("selected");

                }

              }
            );

          } else {

            delete answers[item.id];

            label.classList.remove(
              "selected"
            );

          }


          updateProgress();

        }
      );


      label.appendChild(
        checkbox
      );


      const span =
        document.createElement("span");

      span.textContent =
        option.text;


      label.appendChild(
        span
      );


      card.appendChild(label);

    });


    container.appendChild(card);

  });


  updateProgress();

}


/* =====================================================
   PROGRESS
===================================================== */

function updateProgress() {

  const answered =
    Object.keys(answers).length;

  const total =
    questions.length;


  document
    .getElementById("progressText")
    .textContent =
    answered + " / " + total;


  const percent =
    total > 0
      ? (answered / total) * 100
      : 0;


  document
    .getElementById("progressBar")
    .style.width =
    percent + "%";

}


/* =====================================================
   TIMER
===================================================== */

function mulaiTimer() {

  clearInterval(timerInterval);


  timerInterval =
    setInterval(function() {

      if (!startTime) return;


      const now =
        new Date();


      const diff =
        now.getTime() -
        startTime.getTime();


      const totalSeconds =
        Math.floor(diff / 1000);


      const hours =
        Math.floor(
          totalSeconds / 3600
        );


      const minutes =
        Math.floor(
          (totalSeconds % 3600) / 60
        );


      const seconds =
        totalSeconds % 60;


      document
        .getElementById("timer")
        .textContent =
        String(hours).padStart(2,"0")
        + ":" +
        String(minutes).padStart(2,"0")
        + ":" +
        String(seconds).padStart(2,"0");


    }, 1000);

}


/* =====================================================
   KIRIM UJIAN
===================================================== */

function kirimUjian() {

  if (!examActive) return;


  const unanswered =
    questions.filter(function(item) {

      return !answers[item.id];

    });


  if (unanswered.length > 0) {

    const nomor =
      unanswered
        .map(function(item) {

          return (
            questions.indexOf(item) + 1
          );

        });


    const warning =
      document.getElementById("warning");


    warning.innerHTML =
      "<strong>Masih ada soal yang belum dijawab.</strong><br>" +
      "Nomor soal: " +
      nomor.join(", ") +
      "<br><br>" +
      "Silakan lengkapi terlebih dahulu.";


    warning.style.display =
      "block";


    const first =
      document.getElementById(
        "question-" +
        unanswered[0].id
      );


    if (first) {

      first.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }


    return;

  }


  const yakin =
    confirm(
      "Semua soal sudah dijawab.\n\n" +
      "Apakah Anda yakin ingin mengirim jawaban?"
    );


  if (!yakin) return;


  const button =
    document.getElementById(
      "submitButton"
    );


  button.disabled = true;

  button.textContent =
    "⏳ Mengirim jawaban...";


  const payload = {

    token: token,

    answers: answers

  };


  google.script.run

    .withSuccessHandler(function(result) {

      clearInterval(
        timerInterval
      );


      examActive = false;


      document
        .getElementById("examPage")
        .classList.add("hidden");


      document
        .getElementById("successPage")
        .classList.remove("hidden");


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    })

    .withFailureHandler(function(err) {

      button.disabled = false;

      button.textContent =
        "📤 Kirim Jawaban";


      const warning =
        document.getElementById(
          "warning"
        );


      warning.innerHTML =
        "⚠️ " +
        (
          err.message ||
          "Jawaban gagal dikirim."
        );


      warning.style.display =
        "block";


    })

    .submitExam(payload);

}


/* =====================================================
   PERINGATAN KELUAR HALAMAN
===================================================== */

window.addEventListener(
  "beforeunload",
  function(e) {

    if (!examActive) return;

    e.preventDefault();

    e.returnValue = "";

  }
);


</script>

</body>

</html>
